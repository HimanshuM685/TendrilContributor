# Tendril contributor — Docker sandboxes. Works on Mac (Docker Desktop) and Linux.
#
#   cp .env.example .env
#   docker compose up --build
#
# Firecracker is Linux+KVM only: docker compose -f docker-compose.firecracker.yml up --build

services:
  contributor:
    build: .
    image: tendril-contributor
    env_file: .env
    environment:
      TENDRIL_RUNTIME: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
