# Tendril contributor — Docker sandboxes. Works on Mac (Docker Desktop) and Linux.
#
#   cp .env.example .env
#   docker compose up --build

services:
  contributor:
    build: .
    image: tendril-contributor
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
