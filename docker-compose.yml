# Tendril contributor agent — share THIS Linux machine's compute.
#
#   cp .env.example .env            # TENDRIL_API_KEY, JAILER_UID, JAILER_GID
#   docker compose up -d --build    # daemon: registers, waits for leases
#   docker compose logs -f          # expect "runtime=microvm kvm=true"
#   docker compose down             # destroys every microVM, then exits
#
# Idle, the agent holds zero VMs. Each paid lease boots one jailed Firecracker
# microVM (rootfs exported once from ./sandbox-ssh) and destroys it on release,
# watchdog or registry disconnect. Host prep: README.md "Firecracker (Linux)".

services:
  contributor:
    build: .
    image: tendril-contributor
    env_file: .env
    environment:
      TENDRIL_RUNTIME: ${TENDRIL_RUNTIME:-firecracker}
      GUEST_KERNEL: ${GUEST_KERNEL:-/opt/tendril-kernel/vmlinux}
      TENDRIL_STATE_DIR: /var/lib/tendril
    # jailer needs /dev/kvm, tun, netns, iptables and a writable cgroup tree.
    # Host networking lets lease NAT rules reach the uplink; the agent itself
    # still listens on nothing. cgroup: private + docker-entrypoint.sh keep the
    # VMMs inside this container's cgroup so stop/kill reaps them.
    privileged: true
    network_mode: host
    cgroup: private
    init: true
    devices:
      - /dev/kvm
      - /dev/net/tun
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Template cache + lease manifests. Survives restarts so reconcile can
      # clean anything a crash left behind before the node re-registers.
      - /var/lib/tendril:/var/lib/tendril
      - /opt/tendril-kernel:/opt/tendril-kernel:ro
    restart: unless-stopped
    # Graceful SIGTERM tears down guests, relay mappings and netns first.
    stop_grace_period: 90s
